spring.application.name=SkyShelf
server.address=127.0.0.1
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/skyshelf;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.max-http-request-header-size=16KB
app.storage=local
app.storage-dir=./data/objects
app.demo=false
app.quota-bytes=16106127360
# Только для локальной демонстрации. В production ключ передаётся через SKYSHELF_MASTER_KEY.
app.crypto.master-key=U2t5U2hlbGYtRGVtby1NYXN0ZXItS2V5LTIwMjYhISE=
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
