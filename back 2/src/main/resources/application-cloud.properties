spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/skyshelf}
spring.datasource.username=${DB_USER:skyshelf}
spring.datasource.password=${DB_PASSWORD}
app.storage=minio
app.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
app.minio.user=${MINIO_USER:skyshelf}
app.minio.password=${MINIO_PASSWORD}
app.minio.bucket=skyshelf
app.crypto.master-key=${SKYSHELF_MASTER_KEY}
server.servlet.session.cookie.secure=true
